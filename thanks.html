<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks! | Lawnfetti</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Nunito,system-ui,sans-serif;color:#1d1630;text-align:center;padding:20px;box-sizing:border-box;
  background-color:#fffaf3;background-image:radial-gradient(circle at 20% 30%,#ff3ea5 0 3px,transparent 4px),radial-gradient(circle at 70% 80%,#16bfb0 0 3px,transparent 4px),radial-gradient(circle at 85% 25%,#ffc93c 0 3px,transparent 4px);background-size:140px 140px,170px 170px,120px 120px}
.card{background:#fff;border:3px solid #1d1630;border-radius:28px;padding:44px 32px;max-width:520px;box-shadow:10px 10px 0 #ff3ea5}
.big{font-size:3.4rem;margin-bottom:8px}
h1{font-family:Fredoka;font-size:2.4rem;margin:0 0 12px}
p{color:#4a4360;font-size:1.1rem;line-height:1.6}
a.btn{display:inline-block;margin-top:18px;font-family:Fredoka;font-weight:600;font-size:1.1rem;padding:14px 26px;border-radius:99px;text-decoration:none;border:3px solid #1d1630;background:#ff3ea5;color:#fff;box-shadow:4px 4px 0 #1d1630}
.sig{font-family:Pacifico;color:#e01f87;font-size:1.4rem;margin-top:22px}
</style>
</head>
<body>
  <div class="card">
    <div class="big">🎉</div>
    <h1>Request received!</h1>
    <p>Thanks for thinking of Lawnfetti. We'll email you soon to confirm your date, go over the design and send payment details. Your date is reserved once payment is received.</p>
    <p>Questions in the meantime? Email <a href="mailto:hello@lawnfetti.com">hello@lawnfetti.com</a>.</p>
    <a class="btn" href="/">Back to Lawnfetti</a>
    <div class="sig">We love to celebrate YOU!</div>
  </div>
</body>
</html>
